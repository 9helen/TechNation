<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08090f"><title>All stories · TechNation</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Noto+Sans+Myanmar:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#08090f;--panel:#11131d;--line:#292b39;--white:#f5f6fa;--muted:#a9adbb;--red:#f20d32;--latin:"Onest","Noto Sans Myanmar",sans-serif;--my:"Noto Sans Myanmar","Onest",sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% 0%,#18344d66,transparent 32%),radial-gradient(ellipse at 5% 70%,#f20d3214,transparent 35%),var(--bg);color:var(--white);font:16px/1.8 var(--my)}a{color:inherit;text-decoration:none}.wrap{width:min(1160px,calc(100% - 40px));margin:auto}.top{border-bottom:1px solid #ffffff18;background:#08090fbb;backdrop-filter:blur(14px)}.nav{height:72px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font:italic 800 22px var(--latin);letter-spacing:-1px;color:var(--red)}.brand img{width:38px;height:38px;object-fit:cover;border-radius:9px;box-shadow:0 0 20px #f20d3233}.back{font:600 13px var(--latin);color:#d6d8e1}.intro{padding:46px 0 25px}.eyebrow{font:600 11px var(--latin);letter-spacing:.16em;text-transform:uppercase;color:#ff8095}.intro h1{font:700 clamp(30px,5vw,48px)/1.2 var(--latin);letter-spacing:-.04em;margin:7px 0 8px}.intro p{color:var(--muted);margin:0}.section-label{font:600 12px var(--latin);letter-spacing:.12em;text-transform:uppercase;color:#bec1ce;margin:20px 0 12px}.expanded-posts[hidden]{display:none}.expanded-list{display:grid;gap:16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;padding:5px 0 70px}.card{min-width:0;overflow:hidden;border:1px solid #ffffff19;border-radius:18px;background:linear-gradient(145deg,#171923,#10121b);box-shadow:0 16px 48px #0003}.card-head{display:grid;grid-template-columns:155px minmax(0,1fr);gap:18px;padding:16px}.thumb{display:block;width:155px;height:142px;object-fit:cover;border-radius:12px;background:#090b12}.meta{display:block;color:#9da2b2;font:12px var(--latin);margin:2px 0 8px}.card h2{font-size:19px;line-height:1.55;margin:0 0 8px}.excerpt{font-size:13px;line-height:1.75;color:#b9bdc9;margin:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.expand-toggle{display:block;margin:0 16px 14px;padding:7px 12px;border:1px solid #f20d3255;border-radius:999px;background:#f20d3212;color:#ff8095;font:600 13px var(--latin);cursor:pointer}.expand-toggle:hover{background:#f20d3226;color:white}.end-toggle{margin:18px 0 0}.expand-toggle:focus-visible{outline:2px solid #ff8095;outline-offset:3px}.full[hidden]{display:none}.full{border-top:1px solid #ffffff12;margin:0 16px;padding:15px 0 20px;white-space:pre-wrap;color:#d7d9e2;font-size:15px;line-height:2}.full p{margin:0 0 14px}.full h3{font-size:20px;color:white;margin:24px 0 7px}.full ul{padding-left:22px;margin:10px 0 18px}.full img{display:none}.card.expanded .card-head{display:block;padding:20px 20px 8px}.card.expanded .thumb{width:100%;height:auto;max-height:none;object-fit:contain;border-radius:13px;margin-bottom:17px}.card.expanded .excerpt{display:none}.card.expanded .expand-toggle{margin-left:20px}.card.expanded .full{margin:0 20px;padding-top:18px}.empty{color:var(--muted);grid-column:1/-1;padding:30px;text-align:center;border:1px dashed #ffffff25;border-radius:16px}@media(max-width:700px){.wrap{width:min(100% - 28px,560px)}.grid{grid-template-columns:1fr;gap:13px}.intro{padding-top:32px}.card-head{grid-template-columns:112px minmax(0,1fr);gap:13px;padding:12px}.thumb{width:112px;height:112px}.card h2{font-size:16px;line-height:1.5}.excerpt{font-size:12px;-webkit-line-clamp:2}.expand-toggle{margin:0 12px 12px}.card.expanded .card-head{padding:12px 12px 8px}.card.expanded .expand-toggle{margin-left:12px}.card.expanded .full{margin:0 12px;padding-top:12px}.brand{font-size:19px}}
</style></head>
<body><header class="top"><div class="wrap nav"><a class="brand" href="/"><img src="/assets/technation-mark.jpg" alt=""><span>TECHNATION</span></a><a class="back" href="/">← Back to home</a></div></header>
<main class="wrap"><header class="intro"><div class="eyebrow">TechNation · Archive</div><h1>All blog posts</h1><p>ဆောင်းပါးအားလုံးကို ဖတ်ရှုရန်။ စိတ်ဝင်စားသော ပို့စ်ကို ဖွင့်ပြီး အပြည့်အစုံ ဖတ်နိုင်ပါတယ်။</p></header><section id="expanded-posts" class="expanded-posts" hidden><h2 class="section-label">Reading</h2><div id="expanded-list" class="expanded-list"></div></section><section><h2 class="section-label">Browse all posts</h2><div class="grid" id="blog-grid" aria-label="All blog posts"></div></section></main>
<script>
const API_BASE=location.origin;
const staticPosts=__STATIC_POSTS__;
const grid=document.querySelector('#blog-grid'),expandedSection=document.querySelector('#expanded-posts'),expandedList=document.querySelector('#expanded-list');
function sortThumbnails(){[...grid.children].sort((a,b)=>Number(b.dataset.publishedAt)-Number(a.dataset.publishedAt)).forEach(card=>grid.append(card))}
function addCard(post){const card=document.createElement('article');card.className='card';card.dataset.publishedAt=String(post.publishedAt?Date.parse(post.publishedAt):Date.parse(post.date)||0);card.id=post.anchor||'';const head=document.createElement('div');head.className='card-head';const img=document.createElement('img');img.className='thumb';img.src=post.imageUrl.startsWith("/media/")?new URL(post.imageUrl,API_BASE).href:post.imageUrl;img.alt='';img.loading='lazy';const info=document.createElement('div');const meta=document.createElement('small');meta.className='meta';meta.textContent=post.date;const title=document.createElement('h2');title.textContent=post.title;const excerpt=document.createElement('p');excerpt.className='excerpt';excerpt.textContent=post.excerpt;info.append(meta,title,excerpt);head.append(img,info);const button=document.createElement('button');button.type='button';button.className='expand-toggle';button.textContent='…see more';button.setAttribute('aria-expanded','false');const full=document.createElement('div');full.className='full';full.hidden=true;if(post.bodyHtml)full.innerHTML=post.bodyHtml;else{const p=document.createElement('p');p.textContent=post.body||'';full.append(p)}const endButton=document.createElement('button');endButton.type='button';endButton.className='expand-toggle end-toggle';endButton.textContent='…see less';endButton.addEventListener('click',()=>button.click());full.append(endButton);button.addEventListener('click',()=>{const opening=!card.classList.contains('expanded');if(opening){card.classList.add('expanded');button.textContent='…see less';button.setAttribute('aria-expanded','true');full.hidden=false;expandedList.append(card);expandedSection.hidden=false}else{card.classList.remove('expanded');button.textContent='…see more';button.setAttribute('aria-expanded','false');full.hidden=true;grid.append(card);sortThumbnails();if(!expandedList.children.length)expandedSection.hidden=true}});card.append(head,button,full);grid.append(card);sortThumbnails()}
staticPosts.forEach(addCard);
(async()=>{try{const r=await fetch(new URL('/api/posts',API_BASE));if(!r.ok)return;const {posts=[]}=await r.json();posts.sort((a,b)=>new Date(b.publishedAt)-new Date(a.publishedAt));for(const p of posts)addCard({anchor:'community-'+p.id,date:new Date(p.publishedAt).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}),title:p.title,imageUrl:p.imageUrl,excerpt:p.body.slice(0,180),body:p.body})}catch{}})();
</script></body></html>
